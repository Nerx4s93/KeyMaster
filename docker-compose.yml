services:
  keymaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: keymaster:latest
    container_name: keymaster
    extra_hosts:
      - "mail.nerx.fun:host-gateway"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:1337:8080"
    volumes:
      - keymaster-data:/data

volumes:
  keymaster-data:
